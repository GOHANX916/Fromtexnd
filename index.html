<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chat container */
        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Prevent messages from going behind input */
        }

        /* Message styling */
        .message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .message img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .message .content {
            max-width: 70%;
            padding: 10px;
            border-radius: 8px;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.sent .content {
            background-color: #34D399;
            color: white;
        }

        .message.received .content {
            background-color: #374151;
            color: white;
        }

        /* ✅ Fixed input box visibility */
        .input-container {
            position: sticky;
            bottom: 0;
            width: 100%;
            background: #1F2937;
            padding: 10px;
            display: flex;
            border-top: 1px solid #374151;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background: #111827;
            color: white;
            border: 1px solid #374151;
        }

        .input-container button {
            margin-left: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #34D399;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-900 text-white">

    <!-- Header -->
    <div class="p-4 border-b border-gray-700 flex items-center justify-between">
        <div class="flex items-center">
            <img class="w-12 h-12 rounded-full mr-4" src="https://storage.googleapis.com/a1aa/image/57g9bJnQ7UgVJfKsL9WZ_4p9hXz_JfdGLQMDAU1sIBc.jpg"/>
            <div>
                <h2 class="text-lg font-semibold">John Doe</h2>
                <p class="text-sm text-gray-400">Online</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <i class="fas fa-search text-gray-400"></i>
            <i class="fas fa-ellipsis-v text-gray-400"></i>
        </div>
    </div>

    <!-- Chat Messages -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <!-- ✅ Fixed Input Box -->
    <div class="input-container">
        <input id="message" type="text" placeholder="Type a message..." />
        <button id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
