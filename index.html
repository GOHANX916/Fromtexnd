<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col bg-gray-900 text-white">

    <!-- Chat Header -->
    <div class="p-4 border-b border-gray-700 flex items-center justify-between">
        <div class="flex items-center">
            <img class="w-12 h-12 rounded-full" src="https://storage.googleapis.com/a1aa/image/57g9bJnQ7UgVJfKsL9WZ_4p9hXz_JfdGLQMDAU1sIBc.jpg" alt="User">
            <div>
                <h2 class="text-lg font-semibold">John Doe</h2>
                <p id="status" class="text-sm text-gray-400">Offline</p>
            </div>
        </div>
    </div>

    <!-- Chat Messages -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <!-- Message Input -->
    <div class="p-4 border-t border-gray-700 flex items-center bg-gray-900">
        <input id="message" class="flex-1 p-2 border border-gray-600 rounded-lg bg-gray-800 text-white" placeholder="Type a message..." type="text">
        <button id="sendBtn" class="ml-4 bg-green-600 text-white p-2 rounded-lg">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
