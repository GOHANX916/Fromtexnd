<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Chat Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
   body {
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
   }
  </style>
</head>
<body class="h-screen flex flex-col bg-gray-900 text-white">
  <!-- Main Chat Area -->
  <div class="flex-1 flex flex-col">
   <div class="p-4 border-b border-gray-700 flex items-center justify-between">
    <div class="flex items-center">
     <img class="w-12 h-12 rounded-full mr-4" src="https://storage.googleapis.com/a1aa/image/57g9bJnQ7UgVJfKsL9WZ_4p9hXz_JfdGLQMDAU1sIBc.jpg"/>
     <div>
      <h2 class="text-lg font-semibold">John Doe</h2>
      <p class="text-sm text-gray-400">Online</p>
     </div>
    </div>
    <div class="flex items-center space-x-4">
     <i class="fas fa-search text-gray-400"></i>
     <i class="fas fa-ellipsis-v text-gray-400"></i>
    </div>
   </div>

   <!-- Chat Messages -->
   <div class="flex-1 overflow-y-auto p-4 space-y-4">
    <div class="flex items-start space-x-4">
     <img class="w-10 h-10 rounded-full" src="https://storage.googleapis.com/a1aa/image/57g9bJnQ7UgVJfKsL9WZ_4p9hXz_JfdGLQMDAU1sIBc.jpg"/>
     <div class="bg-gray-800 p-3 rounded-lg">
      <p class="text-sm">Hey, how are you?</p>
     </div>
    </div>
    <div class="flex items-start space-x-4 justify-end">
     <div class="bg-green-600 text-white p-3 rounded-lg">
      <p class="text-sm">I'm good, thanks! How about you?</p>
     </div>
     <img class="w-10 h-10 rounded-full" src="https://storage.googleapis.com/a1aa/image/iy1CpzJ72a_d5O7OOvIArh070PbH2fGIl9o5buhRXkE.jpg"/>
    </div>
   </div>

   <!-- ✅ FIXED: Input Bar Always Visible -->
   <div class="p-4 border-t border-gray-700 flex items-center bg-gray-900 sticky bottom-0">
    <input id="message" class="flex-1 p-2 border border-gray-600 rounded-lg bg-gray-800 text-white" placeholder="Type a message..." type="text"/>
    <button class="ml-4 bg-green-600 text-white p-2 rounded-lg" id="sendBtn">
     <i class="fas fa-paper-plane"></i>
    </button>
   </div>
  </div>

  <script>
   // Auto-scroll to the latest message
   function scrollToBottom() {
       const chatContainer = document.querySelector(".overflow-y-auto");
       chatContainer.scrollTop = chatContainer.scrollHeight;
   }
   scrollToBottom();
  </script>
</body>
</html>
